
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA MUSIC</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  padding-bottom: 100px;
}

header {
  padding: 25px;
  background: #111;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #1ed760;
  letter-spacing: 2px;
}

header span {
  color: #aaa;
  font-size: 13px;
}

.container {
  padding: 25px;
  max-width: 850px;
  margin: auto;
}

.hero {
  background: linear-gradient(135deg,#123c28,#101010);
  padding: 35px 25px;
  border-radius: 18px;
  margin-bottom: 25px;
}

.hero h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

.hero p {
  color: #ccc;
  line-height: 1.5;
}

.search {
  width: 100%;
  padding: 15px;
  background: #202020;
  border: 1px solid #333;
  border-radius: 25px;
  color: white;
  outline: none;
  margin-bottom: 25px;
}

h2 {
  margin-bottom: 18px;
}

.song {
  display: flex;
  align-items: center;
  padding: 13px;
  background: #151515;
  border-radius: 12px;
  margin-bottom: 10px;
  gap: 14px;
  transition: .2s;
}

.song:hover {
  background: #242424;
}

.cover {
  width: 52px;
  height: 52px;
  border-radius: 9px;
  background: linear-gradient(135deg,#1ed760,#064c2a);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  flex-shrink: 0;
}

.info {
  flex: 1;
  min-width: 0;
}

.info h3 {
  font-size: 15px;
  margin-bottom: 6px;
}

.info p {
  color: #999;
  font-size: 12px;
}

.play {
  background: #1ed760;
  color: black;
  border: none;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 17px;
  cursor: pointer;
  flex-shrink: 0;
}

.player {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #181818;
  border-top: 1px solid #333;
  padding: 15px 20px;
  z-index: 10;
}

.player-content {
  max-width: 850px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 15px;
}

.player-info {
  flex: 1;
  min-width: 0;
}

.player-info h3 {
  font-size: 14px;
  margin-bottom: 5px;
}

.player-info p {
  font-size: 12px;
  color: #aaa;
}

.main-play {
  background: #1ed760;
  color: black;
  padding: 12px 18px;
  border: none;
  border-radius: 25px;
  font-weight: bold;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">♫ NOVA MUSIC</div>
  <span>YOUR MUSIC SPACE</span>
</header>

<div class="container">

  <div class="hero">
    <h1>Feel The Music 🎧</h1>
    <p>
      Nikmati kumpulan lagu favoritmu.
      Putar musik, nikmati suasana,
      dan temukan kenangan di setiap lagu.
    </p>
  </div>

  <input
    class="search"
    type="text"
    id="search"
    placeholder="🔍 Cari judul lagu atau penyanyi..."
    oninput="searchSong()"
  >

  <h2>Playlist Favorit ♫</h2>

  <div id="playlist"></div>

</div>

<footer>
  © 2026 NOVA MUSIC | Made with ♡
</footer>

<div class="player">
  <div class="player-content">
    <div class="cover">♫</div>

    <div class="player-info">
      <h3 id="currentTitle">Pilih lagu terlebih dahulu</h3>
      <p id="currentArtist">NOVA MUSIC</p>
    </div>

    <button class="main-play" onclick="openSong()">
      ▶ PLAY
    </button>
  </div>
</div>

<script>

const songs = [
  {
    title: "Cinta Terakhir",
    artist: "Ari Lasso"
    file:"Ari+Lasso+-+Cinta+Terakhir+_+Lirik+Lagu [hurKMuNktVg].mp3"
    cover: "e850a6af940d44800207bd7cf5d2dbded6ca5c1e.jpeg"
  },
  {
    title: "Mungkin Nanti",
    artist: "NOAH"
    file:"Noah - Mungkin Nanti Lirik Video.mp3"
    cover: "images (1).jpeg"
  },
  {
    title: "Separuh Aku",
    artist: "NOAH"
    file:"NOAH - Separuh Aku (Official Music Video).mp3"
    cover: "images (4).jpeg"
  },
  {
    title: "Tapi Bukan Aku",
    artist: "Kerispatih"
    file:"Kerispatih - Tapi Bukan Aku (Official Music Video NAGASWARA).mp3"
    cover: "images (3).jpeg"
  },
  {
    title: "Mengenangmu",
    artist: "Kerispatih"
    file:"Kerispatih - Mengenangmu (Official Music Video NAGASWARA) music.mp3"
    cover: "images (3).jpeg"
  },
  {
    title: "Hidup Untukmu Mati Tanpamu",
    artist: "NOAH"
    file:"NOAH - Hidup Untukmu, Mati Tanpamu (Official Audio).mp3"
    cover: "images (5).jpeg"
  },
  {
    title: "Duka",
    artist: "Last Child"
    file:"Last+Child+-+Duka+(Official+Lyric+Visualizer) [IqxRMY_UJ5o].mp3"
    cover: "ab67616d0000b2733e19058e3db31816a65baf39.jpeg"
  },
  {
    title: "Separuh Nafas",
    artist: "Dewa 19"
    file:"Dewa 19 - Separuh Nafas (Official Audio).mp3"
    cover: "ab67616d0000b273b98aedc37c1ca212000909c9.jpeg"
  },
  {
    title: "Hapus Aku",
    artist: "Nidji"
    file:"NIDJI - Hapus Aku (Official Music Video).mp3"
    cover: "ab67616d0000b2734e1e4f1f00c9db46630cd2a6.jpeg"
  }
];

let selectedSong = null;

function renderSongs(data) {
  const playlist = document.getElementById("playlist");

  playlist.innerHTML = "";

  data.forEach(song => {
    const index = songs.indexOf(song);

    playlist.innerHTML += `
      <div class="song">
        <div class="cover">♫</div>

        <div class="info">
          <h3>${song.title}</h3>
          <p>${song.artist}</p>
        </div>

        <button class="play"
          onclick="selectSong(${index})">
          ▶
        </button>
      </div>
    `;
  });
}

function selectSong(index) {
  selectedSong = songs[index];

  document.getElementById("currentTitle").textContent =
    selectedSong.title;

  document.getElementById("currentArtist").textContent =
    selectedSong.artist;

  openSong();
}

function openSong() {
  if (!selectedSong) {
    alert("Pilih lagu terlebih dahulu!");
    return;
  }

  const query = encodeURIComponent(
    selectedSong.title + " " + selectedSong.artist
  );

  window.open(
    "https://www.youtube.com/results?search_query=" + query,
    "_blank"
  );
}

function searchSong() {
  const keyword = document
    .getElementById("search")
    .value.toLowerCase();

  const filtered = songs.filter(song =>
    song.title.toLowerCase().includes(keyword) ||
    song.artist.toLowerCase().includes(keyword)
  );

  renderSongs(filtered);
}

renderSongs(songs);

</script>

</body>
</html>
